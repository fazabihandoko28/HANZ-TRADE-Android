<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANZ Health</title><style>body{font:16px system-ui;background:#07111f;color:#eef4ff;margin:0;padding:24px}.card{max-width:760px;margin:auto;background:#10223a;border:1px solid #294767;border-radius:18px;padding:22px}pre{white-space:pre-wrap;color:#b9cbe1}.ok{color:#6ee7a0}.bad{color:#ff8b8b}</style><div class="card"><h1>HANZ Data Health</h1><div id="state">Loading…</div><pre id="json"></pre></div><script>fetch('/health.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{const s=document.querySelector('#state');s.textContent=x.overall;s.className=x.overall==='OK'?'ok':'bad';document.querySelector('#json').textContent=JSON.stringify(x,null,2)}).catch(e=>document.querySelector('#state').textContent=e)</script>
