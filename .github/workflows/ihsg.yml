name: Update IHSG Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ihsg.yml'
      - 'scripts/update-ihsg.mjs'
  schedule:
    # Hourly through the IDX trading session: 09:00–17:00 WIB
    - cron: '0 2-10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hanz-ihsg-update
  cancel-in-progress: false

jobs:
  update-ihsg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update IHSG snapshot
        run: |
          for attempt in 1 2 3; do
            if node scripts/update-ihsg.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "IHSG updater failed; retrying (attempt $((attempt + 1))/3)."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- public/ihsg.json; then
            echo 'No IHSG change to commit.'
            exit 0
          fi
          git config user.name 'hanz-bot'
          git config user.email 'hanz-bot@users.noreply.github.com'
          git add public/ihsg.json
          git commit -m 'Update IHSG snapshot'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
